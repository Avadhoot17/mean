<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Registration</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    form { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
    label { font-weight: bold; margin-bottom: 5px; display: block; }
    input, button { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 3px; }
    button { background: #007BFF; color: #fff; cursor: pointer; }
    button:hover { background: #0056b3; }
    .error { color: red; font-size: 14px; }
  </style>
</head>
<body>
  <form id="employeeForm">
    <label>Name</label> <input type="text" id="name" required>
    <label>DOB</label> <input type="date" id="dob" required> <div class="error" id="dobErr"></div>
    <label>Joining Date</label> <input type="date" id="joinDate" required> <div class="error" id="joinErr"></div>
    <label>Salary</label> <input type="number" id="salary" required> <div class="error" id="salErr"></div>
    <button type="submit">Register</button>
  </form>

  <script>
    document.getElementById('employeeForm').addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true, today = new Date();
      const dob = new Date(document.getElementById('dob').value),
            joinDate = new Date(document.getElementById('joinDate').value),
            salary = parseFloat(document.getElementById('salary').value);

      document.getElementById('dobErr').textContent = (today.getFullYear() - dob.getFullYear() < 18) ? "Must be 18+ years." : "";
      document.getElementById('joinErr').textContent = (joinDate < today) ? "Joining date can't be in the past." : "";
      document.getElementById('salErr').textContent = (salary <= 0) ? "Salary must be > 0." : "";

      valid = !(document.getElementById('dobErr').textContent || 
                document.getElementById('joinErr').textContent || 
                document.getElementById('salErr').textContent);

      if (valid) { alert("Employee Registered!"); e.target.reset(); }
    });
  </script>
</body>
</html>

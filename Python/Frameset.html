<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frameset Example</title>
</head>
<frameset rows="33%,33%,34%" border="2">
  <!-- First row with two frames -->
  <frameset cols="50%,50%">
    <frame src="first_frame.html" name="firstFrame">
    <frame src="second_frame.html" name="secondFrame">
  </frameset>

  <!-- Second row with two frames -->
  <frameset cols="50%,50%">
    <frame src="third_frame.html" name="thirdFrame">
    <frame src="fourth_frame.html" name="fourthFrame">
  </frameset>

  <!-- Third row with two frames -->
  <frameset cols="50%,50%">
    <frame src="fifth_frame.html" name="fifthFrame">
    <frame src="sixth_frame.html" name="sixthFrame">
  </frameset>
</frameset>

<noframes>
  <body>
    <p>Your browser does not support frames. Please use a modern browser.</p>
  </body>
</noframes>
</html>






<!DOCTYPE html>
<html>
<head><title>First Frame</title></head>
<body>
  <p>First Frame: Name</p>
  <p>John Doe</p>
</body>
</html>




<!DOCTYPE html>
<html>
<head><title>Second Frame</title></head>
<body>
  <p>Second Frame: Address</p>
  <p>123 Main Street</p>
</body>
</html>




<!DOCTYPE html>
<html>
<head><title>Third Frame</title></head>
<body>
  <p>Third Frame: Bulleted List of Qualifications</p>
  <ul>
    <li>Bachelor's Degree</li>
    <li>Master's Degree</li>
    <li>PhD</li>
  </ul>
</body>
</html>




<!DOCTYPE html>
<html>
<head><title>Fourth Frame</title></head>
<body>
  <p>Fourth Frame: Scrolling Message</p>
  <marquee>Welcome to my webpage!</marquee>
</body>
</html>



<!DOCTYPE html>
<html>
<head><title>Fifth Frame</title></head>
<body>
  <p>Fifth Frame: Links to Favorite Sites</p>
  <a href="https://www.google.com" target="_blank">Google</a><br>
  <a href="https://www.wikipedia.org" target="_blank">Wikipedia</a>
</body>
</html>




<!DOCTYPE html>
<html>
<head><title>Sixth Frame</title></head>
<body>
  <p>Sixth Frame: Image</p>
  <img src="https://via.placeholder.com/150" alt="Placeholder Image">
</body>
</html>
